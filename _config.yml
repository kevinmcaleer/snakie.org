title: Snakie
description: Snakie by kevsrobots — the MicroPython IDE for robots and boards

# Current Snakie release shown in the hero pill and footer.
snakie_version: "0.91.0"
url: "https://snakie.org"
baseurl: ""

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Author
author:
  name: Snakie

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  # The Sphinx documentation source (built separately — see docs/README.md).
  - docs
